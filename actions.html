<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>她 · 动作查看器</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
      canvas#view { display: block; width: 100vw; height: 100vh; }
      #panel { position: fixed; left: 12px; top: 12px; bottom: 12px; width: 268px; overflow-y: auto; background: rgba(16, 20, 28, 0.82); color: #e9edf3; border-radius: 12px; padding: 12px 12px 16px; box-sizing: border-box; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
      #panel h1 { font-size: 16px; margin: 2px 0 10px; font-weight: 600; letter-spacing: 0.5px; }
      #panel h2 { font-size: 12px; margin: 14px 0 6px; color: #9fb0c6; font-weight: 600; letter-spacing: 1px; }
      .grid { display: flex; flex-wrap: wrap; gap: 6px; }
      .grid button, .row button { background: #232b38; color: #e9edf3; border: 1px solid #334055; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
      .grid button:hover, .row button:hover { background: #2d3849; }
      .grid button.on { background: #e8642a; border-color: #ff8a52; color: #fff; }
      .grid button.clip { font-family: Consolas, monospace; font-size: 11.5px; padding: 4px 7px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12.5px; }
      .row label { width: 58px; color: #c3cfdd; flex: none; }
      .row input[type=range] { flex: 1; accent-color: #e8642a; }
      .row .val { width: 40px; text-align: right; color: #9fb0c6; font-variant-numeric: tabular-nums; }
      .row select { flex: 1; background: #232b38; color: #e9edf3; border: 1px solid #334055; border-radius: 7px; padding: 4px 6px; font-family: inherit; font-size: 12.5px; }
      .hidden { display: none !important; }
      #now { position: fixed; right: 16px; bottom: 14px; color: #e9edf3; background: rgba(16, 20, 28, 0.7); padding: 6px 12px; border-radius: 8px; font-size: 13px; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #e9edf3; font-size: 16px; background: #0e1116; }
      #hint { color: #8494a8; font-size: 11.5px; margin-top: 12px; line-height: 1.6; }
      .row label.wide { width: auto; cursor: pointer; }
      .row.check input { accent-color: #e8642a; vertical-align: -2px; }
      .grid.dim { opacity: 0.45; }
      .grid button:disabled { opacity: 0.4; cursor: default; }
      #toggle { position: fixed; right: 16px; top: 14px; background: rgba(16, 20, 28, 0.7); color: #e9edf3; border: 1px solid #334055; border-radius: 8px; padding: 6px 11px; font-size: 13px; cursor: pointer; font-family: inherit; }
      @media (max-width: 600px) { #panel { width: auto; right: 12px; top: auto; height: 46vh; } }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel" class="hidden"></div>
    <div id="now" class="hidden"></div>
    <button id="toggle" class="hidden">☰ 面板</button>
    <div id="loading">正在载入她……</div>
    <script type="module" src="/src/game/character/actionViewer.ts"></script>
  </body>
</html>
